<?xml version="1.0" encoding="UTF-8"?>
<!-- 巨构天际线 · 三层视差 + 巨环 + 信标 + 电梯光点；源自 arcology，动画类（beacon/lift/twinkle）依赖 megastructure.css -->
<svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <pattern id="winCyan" width="16" height="24" patternUnits="userSpaceOnUse">
        <rect x="5" y="7" width="3" height="6" fill="#3ae0ff" opacity="0.4"/>
      </pattern>
      <pattern id="winAmber" width="52" height="68" patternUnits="userSpaceOnUse">
        <rect x="22" y="30" width="3" height="6" fill="#ffb454" opacity="0.55"/>
      </pattern>
    </defs>

    <!-- 空中巨环 -->
    <circle cx="720" cy="1620" r="1060" fill="none" stroke="#0a0e13" stroke-width="92" opacity="0.9"/>
    <circle cx="720" cy="2160" r="1680" fill="none" stroke="#0a0e13" stroke-width="34" opacity="0.8"/>

    <!-- 远景层 -->
    <g fill="#0a0e13">
      <rect x="-60" y="430" width="190" height="470"/>
      <rect x="170" y="540" width="120" height="360"/>
      <rect x="420" y="500" width="90" height="400"/>
      <rect x="1130" y="380" width="150" height="520"/>
      <rect x="1198" y="296" width="6" height="90"/>
      <rect x="1330" y="470" width="130" height="430"/>
      <rect x="-20" y="470" width="1480" height="6"/>
    </g>
    <rect x="1150" y="410" width="110" height="470" fill="url(#winCyan)" opacity="0.35"/>

    <!-- 中景层 -->
    <g fill="#070a0e">
      <rect x="60" y="480" width="96" height="420"/>
      <rect x="300" y="610" width="160" height="290"/>
      <rect x="600" y="520" width="280" height="380"/>
      <rect x="640" y="220" width="200" height="680"/>
      <rect x="736" y="138" width="8" height="86"/>
      <rect x="960" y="560" width="180" height="340"/>
      <rect x="1390" y="540" width="70" height="360"/>
      <rect x="-20" y="585" width="1480" height="16"/>
      <rect x="80" y="601" width="8" height="299"/>
      <rect x="270" y="601" width="8" height="299"/>
      <rect x="460" y="601" width="8" height="299"/>
      <rect x="1020" y="601" width="8" height="299"/>
      <rect x="1210" y="601" width="8" height="299"/>
      <rect x="1390" y="601" width="8" height="299"/>
    </g>
    <rect x="656" y="240" width="168" height="640" fill="url(#winCyan)" opacity="0.5"/>
    <rect x="656" y="240" width="168" height="640" fill="url(#winAmber)" opacity="0.5"/>
    <rect x="320" y="630" width="120" height="250" fill="url(#winCyan)" opacity="0.35"/>
    <rect x="978" y="580" width="140" height="300" fill="url(#winCyan)" opacity="0.3"/>
    <rect x="76" y="500" width="64" height="380" fill="url(#winCyan)" opacity="0.25"/>
    <circle class="beacon" cx="740" cy="136" r="5" fill="#ff5d5d"/>
    <circle class="beacon" cx="1201" cy="294" r="3.5" fill="#ff5d5d" style="animation-delay:-3s"/>
    <!-- 电梯光点：沿竖井缓慢上行 -->
    <circle class="lift" cx="740" cy="340" r="2.5" fill="#b8f4ff"/>

    <!-- 近景层 -->
    <g fill="#04060a">
      <rect x="-20" y="780" width="330" height="140"/>
      <rect x="360" y="812" width="200" height="108"/>
      <rect x="620" y="860" width="240" height="60"/>
      <rect x="900" y="790" width="220" height="130"/>
      <rect x="1180" y="770" width="280" height="150"/>
    </g>
    <g fill="#ffb454" opacity="0.7">
      <rect x="60" y="820" width="3" height="6"/><rect x="130" y="850" width="3" height="6"/>
      <rect x="420" y="840" width="3" height="6"/><rect x="960" y="830" width="3" height="6"/>
      <rect x="1260" y="810" width="3" height="6"/><rect x="1360" y="856" width="3" height="6"/>
    </g>

    <!-- 星点 -->
    <g fill="#9fd8e8">
      <circle cx="120" cy="90" r="1.2" opacity=".5"/><circle cx="320" cy="150" r="1" opacity=".35"/>
      <circle cx="520" cy="60" r="1.4" opacity=".6"/><circle cx="880" cy="110" r="1" opacity=".4"/>
      <circle cx="1050" cy="50" r="1.3" opacity=".55"/><circle cx="1290" cy="140" r="1" opacity=".4"/>
      <circle cx="1390" cy="70" r="1.2" opacity=".5"/><circle cx="700" cy="40" r="1" opacity=".35"/>
      <circle class="twinkle" cx="230" cy="240" r="1.3" opacity=".7"/><circle class="twinkle" cx="990" cy="220" r="1.3" opacity=".7"/>
    </g>
  </svg>